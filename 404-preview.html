<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/icons/favicon.ico?v=20260831" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png?v=20260831">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16.png?v=20260831">
  <link rel="apple-touch-icon" sizes="512x512" href="/assets/icons/favicon-512.png?v=20260831">
  <meta name="robots" content="noindex,nofollow">
  <title>404 PAGE NOT FOUND｜OGBうまラボ</title>
  <link rel="stylesheet" href="/styles.css?v=homepage-links-20260906-final">
  <link rel="stylesheet" href="/navigation.css">
  <style>
    body{margin:0;background:#07182d;color:#f7f4ed}
    .error-wrap{min-height:calc(100vh - 92px);display:flex;align-items:center;padding:54px 20px 68px;background:radial-gradient(circle at 50% 20%,rgba(34,70,104,.7),rgba(7,24,45,0) 46%)}
    .error-card{width:min(1050px,100%);margin:auto;display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:44px;align-items:center}
    .error-copy{position:relative;z-index:2}
    .error-code{margin:0;color:#d2ae5c;font-size:clamp(78px,12vw,150px);font-weight:900;letter-spacing:-.06em;line-height:.78}
    .error-label{margin:18px 0 8px;color:#d2ae5c;font-size:12px;font-weight:900;letter-spacing:.2em}
    .error-copy h1{margin:0 0 14px;font-size:clamp(27px,4vw,43px);line-height:1.3}
    .error-copy>p{margin:0 0 26px;color:#c8d2dd;font-size:15px;line-height:1.9}
    .error-actions{display:flex;flex-wrap:wrap;gap:12px}
    .error-actions a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:10px;text-decoration:none;font-weight:800}
    .home-btn{background:#d2ae5c;color:#07182d}
    .data-btn{border:1px solid rgba(210,174,92,.7);color:#f4dfad;background:rgba(255,255,255,.03)}
    .characters{position:relative;min-height:500px;display:flex;align-items:flex-end;justify-content:center}
    .character-panel{position:absolute;overflow:hidden;border-radius:22px;border:1px solid rgba(255,255,255,.14);background:#fff;box-shadow:0 25px 55px rgba(0,0,0,.28)}
    .character-panel img{display:block;width:100%;height:100%;object-fit:cover}
    .gichu{width:68%;height:390px;left:0;bottom:10px;transform:rotate(-2deg)}
    .blitz{width:51%;height:310px;right:0;bottom:0;transform:rotate(3deg);border-color:rgba(210,174,92,.55)}
    .speech{position:absolute;z-index:4;padding:10px 14px;border-radius:14px;background:#fff;color:#07182d;font-weight:800;font-size:13px;line-height:1.45;box-shadow:0 8px 22px rgba(0,0,0,.22)}
    .speech-g{left:1%;top:3%}.speech-b{right:1%;top:16%;background:#d2ae5c}
    .site-header .brand{color:inherit;text-decoration:none}
    @media(max-width:760px){
      .error-wrap{padding-top:38px}.error-card{grid-template-columns:1fr;gap:28px}.error-copy{text-align:center}.error-actions{justify-content:center}
      .characters{min-height:390px;width:min(480px,100%);margin:auto}.gichu{height:300px}.blitz{height:235px}.speech{font-size:11px}
    }
  </style>
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="/" aria-label="OGBうまラボ ホーム"><span class="brand-mark"><img src="/logo.png" alt="うまラボ"></span><span class="brand-copy"><strong>OGBうまラボ</strong><small>KEIBA DATA &amp; MEDIA LAB</small></span></a>
  </div>
</header>
<main class="error-wrap">
  <div class="error-card">
    <section class="error-copy">
      <p class="error-code">404</p>
      <p class="error-label">PAGE NOT FOUND</p>
      <h1>そのページ、見つかりませんでした。</h1>
      <p>URLが変更されたか、ページが移動・削除された可能性があります。<br>ギチュー君も見失ったようです。</p>
      <div class="error-actions">
        <a class="home-btn" href="/">トップページへ戻る →</a>
        <a class="data-btn" href="/ogb-data/daily/">本日のOGB DATAを見る</a>
      </div>
    </section>
    <section class="characters" aria-label="ギチュー君とブリッツ君">
      <div class="speech speech-g">なんで……<br>なんでこのページないんだ……</div>
      <div class="speech speech-b">データでいこう！<br>まずは戻ろう！</div>
      <div class="character-panel gichu"><img src="/assets/images/characters/gichu-02.png" alt="ギチュー君"></div>
      <div class="character-panel blitz"><img src="/assets/images/characters/blitz-01.png" alt="ブリッツ君"></div>
    </section>
  </div>
</main>
</body>
</html>
