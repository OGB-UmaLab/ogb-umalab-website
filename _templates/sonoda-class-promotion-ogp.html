<!-- 園田競馬「次級基準突破可能馬データ」専用。公開する記事の head 内へ挿入し、既存の同名タグがある場合は置換する。 -->
<!-- 記事ごとに {{TITLE}}、{{DESCRIPTION}}、{{ARTICLE_URL}} を置換する。画像URLは固定。 -->
<meta property="og:type" content="article">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:image" content="https://ogb-umalab.com/assets/ogp/sonoda-ogp.png">
<meta property="og:url" content="{{ARTICLE_URL}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">
<meta name="twitter:image" content="https://ogb-umalab.com/assets/ogp/sonoda-ogp.png">
