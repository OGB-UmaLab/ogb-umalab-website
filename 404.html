<html lang="ja">
<head>

<title>404 PAGE NOT FOUND｜OGBうまラボ</title>
<link rel="stylesheet" href="/styles.css?v=homepage-links-20260906-final">
<style>
*{box-sizing:border-box}
body{margin:0;background:#07182d;color:#fff}
.error-page{min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 38%,#163554 0,#0a213a 36%,#07182d 72%)}
.error-head{width:min(1180px,calc(100% - 36px));margin:0 auto;padding:22px 0}
.error-head a{display:inline-flex;align-items:center;gap:12px;color:#fff;text-decoration:none}
.error-head img{width:52px;height:auto}
.error-head strong{font-size:18px}.error-head small{display:block;color:#9eb0c2;font-size:10px;letter-spacing:.12em}
.error-main{flex:1;width:min(1180px,calc(100% - 36px));margin:auto;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(290px,.55fr);gap:34px;align-items:center;padding:18px 0 54px}
.visual img{display:block;width:100%;height:auto;filter:drop-shadow(0 24px 28px rgba(0,0,0,.3))}
.copy{padding-right:8px}
.kicker{margin:0 0 10px;color:#d2ae5c;font-size:12px;font-weight:900;letter-spacing:.18em}
.copy h1{margin:0 0 15px;font-size:clamp(27px,3vw,42px);line-height:1.3}
.copy p{margin:0 0 25px;color:#c6d2dd;font-size:15px;line-height:1.9}
.actions{display:grid;gap:11px}
.actions a{display:flex;align-items:center;justify-content:center;min-height:50px;padding:0 18px;border-radius:10px;font-weight:800;text-decoration:none}
.home{background:#d2ae5c;color:#07182d}.data{border:1px solid rgba(210,174,92,.75);color:#f4dfad;background:rgba(255,255,255,.035)}
.note{margin-top:15px!important;font-size:12px!important;color:#8399ad!important}
@media(max-width:820px){.error-main{grid-template-columns:1fr;gap:14px;text-align:center;padding-top:0}.visual{order:1}.copy{order:2;padding:0}.visual img{width:min(680px,100%);margin:auto}.actions{width:min(440px,100%);margin:auto}.error-head{padding-top:16px}.error-head img{width:45px}}
</style>
</head>
<body>
<div class="error-page">
<header class="error-head"><a href="/"><img src="/logo.png" alt="OGBうまラボ"><span><strong>OGBうまラボ</strong><small>KEIBA DATA &amp; MEDIA LAB</small></span></a></header>
<main class="error-main">
<div class="visual"><img src="/assets/images/characters/ogb-404-characters.png" alt="404 ページが見つからず困っているギチュー君とブリッツ君"></div>
<section class="copy">
<p class="kicker">PAGE NOT FOUND</p>
<h1>お探しのページは<br>見つかりませんでした。</h1>
<p>URLが変更されたか、ページが移動・削除された可能性があります。<br>ギチュー君とブリッツ君も捜索中です。</p>
<div class="actions"><a class="home" href="/">トップページへ戻る →</a><a class="data" href="/ogb-data/daily/">本日のOGB DATAを見る</a></div>
<p class="note">迷ったときは、とりあえずデータでいこう！</p>
</section>
</main>
</div>
</body>
</html>
