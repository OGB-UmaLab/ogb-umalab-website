name: Update sitemap after publishing
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "**/index.html"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitemap-main
  cancel-in-progress: false

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate sitemap from published pages
        run: python3 scripts/update_sitemap.py
      - name: Commit sitemap changes if needed
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "Sitemap is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Update sitemap for newly published pages"
          git pull --rebase origin main
          git push origin HEAD:main
