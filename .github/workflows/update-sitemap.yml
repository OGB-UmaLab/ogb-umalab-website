name: Update sitemap after publishing
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "**/index.html"
      - "scripts/ensure_daily_metadata.py"
      - "scripts/ensure_public_canonical.py"
      - "scripts/update_sitemap.py"
      - "scripts/test_update_sitemap.py"
      - "scripts/audit_site_architecture.cjs"
      - ".github/workflows/update-sitemap.yml"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: sitemap-main
  cancel-in-progress: false

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Metadata enrichment is optional; it must not block sitemap generation.
      - name: Check daily metadata script syntax
        id: metadata-syntax
        continue-on-error: true
        run: python3 -m py_compile scripts/ensure_daily_metadata.py
      - name: Ensure daily OGB DATA page metadata
        if: steps.metadata-syntax.outcome == 'success'
        continue-on-error: true
        run: python3 scripts/ensure_daily_metadata.py
      - name: Check sitemap script syntax
        run: python3 -m py_compile scripts/update_sitemap.py
      - name: Test sitemap exclusions and robots directives
        run: python3 scripts/test_update_sitemap.py
      - name: Generate sitemap from published pages
        run: python3 scripts/update_sitemap.py
      - name: Test public canonical backfill
        run: python3 scripts/ensure_public_canonical.py --self-test
      - name: Add missing canonicals only to public sitemap pages
        run: python3 scripts/ensure_public_canonical.py --manifest "$RUNNER_TEMP/public-canonical-files"
      - name: Audit generated sitemap against all HTML pages
        id: architecture-audit
        # Existing legacy URL issues are reported without blocking daily racing updates.
        continue-on-error: true
        run: node scripts/audit_site_architecture.cjs
      - name: Upload sitemap architecture audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitemap-architecture-audit
          path: test-results/architecture-audit.json
          if-no-files-found: warn
      - name: Commit sitemap changes if needed
        run: |
          git add sitemap.xml ogb-data/daily
          if [ -s "$RUNNER_TEMP/public-canonical-files" ]; then
            git add --pathspec-from-file="$RUNNER_TEMP/public-canonical-files" --pathspec-file-nul
          fi
          if git diff --cached --quiet; then
            echo "Sitemap is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update sitemap and public page canonical metadata"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Report architecture audit result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_OUTCOME: ${{ steps.architecture-audit.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=error
          description="Architecture audit not completed"
          if [ "$AUDIT_OUTCOME" = success ]; then
            state=success
            description="Architecture audit passed"
          elif [ "$AUDIT_OUTCOME" = failure ]; then
            state=failure
            description="Architecture audit found errors; see logs"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context="OGB/site-architecture" -f description="$description" -f target_url="$RUN_URL"
