name: Update sitemap after publishing
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "**/index.html"
      - "scripts/ensure_daily_metadata.py"
      - "scripts/update_sitemap.py"
      - ".github/workflows/update-sitemap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitemap-main
  cancel-in-progress: false

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Metadata enrichment is optional; it must not block sitemap generation.
      - name: Check daily metadata script syntax
        id: metadata-syntax
        continue-on-error: true
        run: python3 -m py_compile scripts/ensure_daily_metadata.py
      - name: Ensure daily OGB DATA page metadata
        if: steps.metadata-syntax.outcome == 'success'
        continue-on-error: true
        run: python3 scripts/ensure_daily_metadata.py
      - name: Check sitemap script syntax
        run: python3 -m py_compile scripts/update_sitemap.py
      - name: Generate sitemap from published pages
        run: python3 scripts/update_sitemap.py
      - name: Commit sitemap changes if needed
        run: |
          if git diff --quiet -- sitemap.xml ogb-data/daily; then
            echo "Sitemap is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml ogb-data/daily
          git commit -m "Update sitemap for newly published pages"
          git pull --rebase origin main
          git push origin HEAD:main
