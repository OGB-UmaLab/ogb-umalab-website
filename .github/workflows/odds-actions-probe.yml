name: Rakuten trifecta odds probe
on:
  push:
    branches: [codex/odds-actions-probe]
    paths:
      - .github/workflows/odds-actions-probe.yml
      - tools/odds-probe/snapshot.mjs
permissions:
  contents: write
concurrency:
  group: odds-actions-probe
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and validate the Rakuten trifecta snapshot
        shell: bash
        run: |
          race_id=202611151106070110
          curl --fail --silent --show-error --max-time 15 -o "$RUNNER_TEMP/odds.html" "https://keiba.rakuten.co.jp/odds/sanrenfuku/RACEID/$race_id"
          node tools/odds-probe/snapshot.mjs "$race_id" "$RUNNER_TEMP/odds.html" tools/odds-probe/snapshot.json
      - name: Store the verified snapshot on the test branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tools/odds-probe/snapshot.json
          git diff --cached --quiet && exit 0
          git commit -m "Save verified trifecta test snapshot"
          git push
