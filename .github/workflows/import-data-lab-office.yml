name: Import original Data Lab office image
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-data-lab-office.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch and validate original image
        run: |
          mkdir -p assets/data-lab-images
          curl --fail --location --retry 3 --silent --show-error \
            "https://raw.githubusercontent.com/OGB-UmaLab/ogb-data-lab-website/main/assets/images/ogb-data-lab-office.png" \
            -o assets/data-lab-images/ogb-data-lab-office.png
          test "$(wc -c < assets/data-lab-images/ogb-data-lab-office.png)" -gt 100000
          file assets/data-lab-images/ogb-data-lab-office.png | grep -q 'PNG image data'
      - name: Commit image without touching other files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data-lab-images/ogb-data-lab-office.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Import original Data Lab office image"
          git pull --rebase origin main
          git push origin HEAD:main
