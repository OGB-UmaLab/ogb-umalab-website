name: Data Lab browser smoke tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'data-lab/**'
      - 'tools/**'
      - 'guides/**'
      - 'examples/**'
      - 'about/**'
      - 'privacy/**'
      - 'scripts/check_data_lab_html.cjs'
      - 'scripts/check_user_journeys.cjs'
      - 'scripts/audit_data_lab_links.cjs'
      - 'scripts/audit_site_architecture.cjs'
      - 'scripts/test_site_architecture.cjs'
      - 'scripts/smoke_test_site.cjs'
      - 'sitemap.xml'
      - '.github/workflows/data-lab-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Data Lab HTML scripts and DOM references
        run: node scripts/check_data_lab_html.cjs
      - name: Check user journeys and downloadable sample data
        run: node scripts/check_user_journeys.cjs
      - name: Audit Data Lab internal links and assets
        run: node scripts/audit_data_lab_links.cjs
      - name: Test SEO audit helpers before browser setup
        run: node scripts/test_site_architecture.cjs
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: node scripts/smoke_test_site.cjs --tools-only
      - name: Audit sitemap and canonical URLs
        if: always()
        run: node scripts/audit_site_architecture.cjs
      - name: Upload architecture audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-audit
          path: test-results/architecture-audit.json
          if-no-files-found: warn
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: data-lab-smoke-failures
          path: test-results/
          if-no-files-found: ignore
