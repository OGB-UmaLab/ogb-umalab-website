name: Browser smoke test of public site
on:
  push:
    branches: [main]
    paths:
      - "scripts/smoke_test_site.cjs"
      - ".github/workflows/smoke-test-site.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke_test_site.cjs
