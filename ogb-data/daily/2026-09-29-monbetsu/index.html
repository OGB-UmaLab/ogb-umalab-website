</style><style id="ogb-race-return-style">.ogb-race-return{display:block;width:fit-content;margin:10px 14px 12px auto;padding:8px 10px;border:1px solid #dfe5ee;border-radius:8px;background:#e5ebf3;color:#172033;text-decoration:none;font-size:13px;line-height:20px;font-weight:700}</style></head><body><div class="wrap"><a class="back" href="../">← 開催競馬場一覧へ</a><div class="brand">2026年9月29日 門別競馬｜OGB DATA</div><div class="sub">地方競馬データ比較ビュー｜列見出しをクリック／タップすると並べ替えできます。</div><a href="https://ogb-umalab.com/ogb-data/major-8-items/" style="display:inline-block;margin:0 0 14px;color:#2563a6;font-size:14px;font-weight:700;text-decoration:underline;text-underline-offset:3px">各項目・色の見方はこちら →</a><div class="racenav" id="race-jump-top"><a href="#r1">1R</a><a href="#r2">2R</a><a href="#r4">4R</a><a href="#r5">5R</a><a href="#r6">6R</a><a href="#r9">9R</a><a href="#r11">11R</a><a href="#r12">12R</a></div><!--RACES--><script>
document.querySelectorAll('.mark-select').forEach(sel=>{
  const saved=localStorage.getItem(sel.dataset.key);
  if(saved!==null) sel.value=saved;
  sel.addEventListener('change',()=>localStorage.setItem(sel.dataset.key,sel.value));
  sel.addEventListener('click',e=>e.stopPropagation());
});
document.querySelectorAll('table').forEach(table=>{
  let state={col:-1,asc:false};
  table.querySelectorAll('th').forEach((th,i)=>{
    if(th.dataset.nosort==='1') return;
    th.addEventListener('click',()=>{
      const body=table.tBodies[0], rows=[...body.rows];
      const label=th.textContent.replace('↕','').trim();
      let asc=state.col===i ? !state.asc : (label==='脚質値');
      if(th.dataset.special==='weight'){
        asc=th.dataset.dir!=='asc';
        th.dataset.dir=asc?'asc':'desc';
      }
      state={col:i,asc};
      rows.sort((a,b)=>{
        let av=a.cells[i].dataset.sort ?? a.cells[i].textContent.trim();
        let bv=b.cells[i].dataset.sort ?? b.cells[i].textContent.trim();
        let an=parseFloat(av), bn=parseFloat(bv);
        let cmp=(!Number.isNaN(an)&&!Number.isNaN(bn)) ? an-bn : String(av).localeCompare(String(bv),'ja');
        return asc?cmp:-cmp;
      });
      rows.forEach(r=>body.appendChild(r));
      table.querySelectorAll('.sortmark').forEach(x=>x.textContent='↕');
      const mark=th.querySelector('.sortmark'); if(mark) mark.textContent=asc?'↑':'↓';
    });
  });
});
