<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>OGB 三連複オッズ取得試験</title>
<style>body{font:1rem system-ui;margin:2rem auto;max-width:40rem;padding:0 1rem;color:#14243b}button{padding:.7rem 1rem}table{border-collapse:collapse;width:100%;margin-top:1rem}td,th{text-align:left;padding:.4rem .65rem;border-bottom:1px solid #dbe2ea}p{line-height:1.6}</style></head>
<body><h1>三連複オッズ取得試験</h1><p>検証対象は2026年11月15日の水沢10Rです。GitHub Actionsが取得した保存データを表示します。</p>
<button id="refresh" type="button">保存済みオッズを読み込む</button><p id="status" role="status"></p>
<table hidden><thead><tr><th scope="col">組み合わせ</th><th scope="col">オッズ</th></tr></thead><tbody></tbody></table>
<script>
const button=document.querySelector('#refresh');
const status=document.querySelector('#status');
const table=document.querySelector('table');
const body=table.tBodies[0];
button.onclick=async()=>{
  button.disabled=true;
  table.hidden=true;
  body.replaceChildren();
  status.textContent='読み込み中';
  try {
    const response=await fetch('./snapshot.json',{cache:'no-store'});
    if(!response.ok) throw Error('保存データが見つかりません（HTTP '+response.status+'）');
    const data=await response.json();
    if(!Array.isArray(data.entries)||data.entries.length!==data.expected) throw Error('全組のデータを確認できません');
    const received=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',dateStyle:'medium',timeStyle:'medium'}).format(new Date(data.fetchedAt));
    for(const entry of data.entries){
      const row=body.insertRow();
      row.insertCell().textContent=entry.combination;
      row.insertCell().textContent=entry.odds===null?'—':entry.display;
    }
    status.textContent=data.title+' ／ '+data.actual+'組 ／ 楽天競馬の掲載 '+(data.listedTime??'表示なし')+' ／ Actions取得 '+received+'（日本時間）';
    table.hidden=false;
  } catch(error) {
    status.textContent='読み込めませんでした。'+error.message;
  } finally {
    button.disabled=false;
  }
};
</script></body></html>
