<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2系列の相関係数｜OGBデータ研究所</title><meta name="description" content="対応する数値からピアソン相関係数を計算します。"><link rel="canonical" href="https://ogb-umalab.com/tools/correlation/"><style>*{box-sizing:border-box}body{margin:0;background:#f5f8fa;color:#18313a;font:16px/1.75 system-ui,"Noto Sans JP",sans-serif}header,footer{background:#123c4c;color:#fff;padding:17px max(20px,calc((100vw - 950px)/2))}header a,footer a{color:white}nav{display:flex;gap:16px;flex-wrap:wrap}main{max-width:950px;margin:auto;padding:30px 20px 60px}h1{font-size:clamp(27px,4vw,38px)}a{color:#075e78}a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #d28a00;outline-offset:3px}.card{background:white;border:1px solid #d8e4e9;border-radius:12px;padding:22px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}label{display:block;font-weight:650;margin-top:12px}input,textarea{width:100%;padding:10px;border:1px solid #9aadb4;border-radius:6px;font:inherit}button{padding:10px 18px;background:#075e78;color:white;border:0;border-radius:7px;font:inherit;cursor:pointer;margin-top:12px}output{display:block;padding:12px;background:#eaf5f8;margin-top:12px;border-radius:8px;white-space:pre-wrap;font-weight:600}.note{border-left:4px solid #13768a;padding-left:15px}.skip{position:absolute;left:12px;top:-120px;background:white;padding:10px}.skip:focus{top:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}main{padding:20px 14px}.card{padding:16px}}</style></head><body><a class="skip" href="#main">本文へ移動</a><header><nav><a href="/">OGBデータ研究所</a><a href="/tools/">無料ツール一覧</a><a href="/guides/">使い方ガイド</a></nav></header><main id="main"><p><a href="/tools/categories/statistics/">← カテゴリー一覧へ戻る</a></p><section id="corr"><h2>2系列の相関係数</h2><p>XとYの値を行ごとに対応させて入力します。値が大きいほど相関が強いとは限らず、相関関係は因果関係を示しません。</p><div class="card grid"><div><label for="xs">X系列</label><textarea id="xs" rows="5">1,2,3,4,5</textarea></div><div><label for="ys">Y系列</label><textarea id="ys" rows="5">2,4,5,7,9</textarea></div><div><button type="button" id="calc-corr">相関を計算</button><div id="handoffIn" style="margin:12px 0" hidden></div><output id="corr-result" aria-live="polite"></output></div></div><p class="note">ピアソンの相関係数は−1から+1の範囲です。0に近い場合は線形関係が弱いことを示します。両系列の件数が一致し、少なくとも2組の有効なデータが必要です。</p></section>
<p>計算はブラウザ内で実行され、入力内容は当サイトのサーバーに送信しません。計算結果は参考値です。</p><script>"use strict";const $=id=>document.getElementById(id);const num=id=>Number($(id).value);const fmt=x=>Number.isFinite(x)?x.toLocaleString("ja-JP",{maximumFractionDigits:4}):"算出不可";const split=s=>s.trim().split(/[\s,、;]+/).filter(Boolean).map(x=>Number(x));function parse(s){const a=split(s);if(!a.length||a.some(x=>!Number.isFinite(x)))throw Error("有効な数値だけを入力してください。");return a}
$("calc-corr").onclick=()=>{try{const x=parse($("xs").value),y=parse($("ys").value);if(x.length!==y.length||x.length<2)throw Error("両系列に同じ件数の数値を2件以上入力してください。");const mx=x.reduce((a,b)=>a+b)/x.length,my=y.reduce((a,b)=>a+b)/y.length;let xx=0,yy=0,xy=0;for(let i=0;i<x.length;i++){const a=x[i]-mx,b=y[i]-my;xx+=a*a;yy+=b*b;xy+=a*b}if(xx===0||yy===0)throw Error("片方の系列がすべて同じ値のため相関を算出できません。");const coefficient=xy/Math.sqrt(xx*yy);if(!Number.isFinite(coefficient))throw Error("数値が大きすぎて相関係数を正確に算出できません。");$("corr-result").textContent="ペア数："+x.length+"\nピアソンの相関係数："+fmt(Math.max(-1,Math.min(1,coefficient)))}catch(e){$("corr-result").textContent=e.message}};
for(const id of ["xs","ys"])$(id).addEventListener("input",()=>{$("corr-result").textContent="数値を変更しました。計算ボタンを押して再計算してください。"});$("calc-corr").click();</script></main><footer>OGBデータ研究所 ／ <a href="/privacy/">プライバシーポリシー</a></footer><script src="../assets/data-transfer.js"></script><script src="../assets/tool-handoff.js"></script><script>
OGBToolHandoff.init({"slug":"correlation","out":[],"inbound":{"csv-analyzer":"xs"}},null,data=>{const parsed=OGBDataTransfer.parse(data.csv);if(parsed.headers.length!==2)throw Error("引継ぎ列数が一致しません。");const values=OGBDataTransfer.numeric(parsed,[0,1]);if(values.missing||values.rows.length<2)throw Error("数値データの形式が不正です。");if(["xs","ys"].some(id=>$(id).value.trim())&&!confirm("現在の数値を選択列のデータに置き換えますか？"))return false;["xs","ys"].forEach((id,i)=>{$(id).value=values.rows.map(r=>r[i]).join("\n");$(id).dispatchEvent(new Event("input",{bubbles:true}))});$("corr-result").textContent=parsed.headers.join(" ／ ")+"： "+values.rows.length+"件を引き継ぎました。"+(/^\d+$/.test(data.day||"")?"欠損・非数値による除外 "+data.day+"行。":"")+"計算ボタンを押してください。";return true});</script><script src="../assets/form-draft.js" data-config='{"slug":"correlation","anchor":"calc-corr","ids":["xs","ys"]}'></script></body></html>
