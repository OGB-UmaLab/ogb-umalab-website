<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>販売利益・損益分岐点シミュレーター｜OGBデータ研究所</title><meta name="description" content="販売価格、販売数、手数料、費用から利益と損益分岐点を計算します。"><link rel="canonical" href="https://ogb-umalab.com/tools/profit-break-even/"><style>*{box-sizing:border-box}body{margin:0;background:#f5f8fa;color:#18313a;font:16px/1.75 system-ui,"Noto Sans JP",sans-serif}header,footer{background:#123c4c;color:#fff;padding:17px max(20px,calc((100vw - 950px)/2))}header a,footer a{color:white}nav{display:flex;gap:16px;flex-wrap:wrap}main{max-width:950px;margin:auto;padding:30px 20px 60px}h1{font-size:clamp(27px,4vw,38px)}a{color:#075e78}a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #d28a00;outline-offset:3px}.card{background:white;border:1px solid #d8e4e9;border-radius:12px;padding:22px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}label{display:block;font-weight:650;margin-top:12px}input,textarea{width:100%;padding:10px;border:1px solid #9aadb4;border-radius:6px;font:inherit}button{padding:10px 18px;background:#075e78;color:white;border:0;border-radius:7px;font:inherit;cursor:pointer;margin-top:12px}output{display:block;padding:12px;background:#eaf5f8;margin-top:12px;border-radius:8px;white-space:pre-wrap;font-weight:600}.note{border-left:4px solid #13768a;padding-left:15px}.skip{position:absolute;left:12px;top:-120px;background:white;padding:10px}.skip:focus{top:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}main{padding:20px 14px}.card{padding:16px}}</style></head><body><a class="skip" href="#main">本文へ移動</a><header><nav><a href="/">OGBデータ研究所</a><a href="/tools/">無料ツール一覧</a><a href="/guides/">使い方ガイド</a></nav></header><main id="main"><p><a href="/tools/categories/sales-profit/">← カテゴリー一覧へ戻る</a></p><section id="profit"><h2>販売利益・損益分岐点シミュレーター</h2><p>販売手数料は売上高に対する割合、変動費は1件あたりの費用として計算します。固定費は販売数によらず発生する費用です。</p><div class="card grid"><div><label for="price">販売単価（円）</label><input id="price" type="number" min="0" value="1980"><label for="units">月間販売数（件）</label><input id="units" type="number" min="0" step="1" value="100"><label for="fee">販売手数料（%）</label><input id="fee" type="number" min="0" max="100" value="10"></div><div><label for="variable">1件あたりの変動費（円）</label><input id="variable" type="number" min="0" value="0"><label for="fixed">月間固定費（円）</label><input id="fixed" type="number" min="0" value="30000"><button type="button" id="calc-profit">利益を計算</button><output id="profit-result" aria-live="polite"></output></div></div><p class="note">計算式：売上＝単価×販売数。利益＝売上－販売手数料－変動費合計－固定費。損益分岐販売数＝固定費÷1件あたり限界利益を切り上げ。税金・返金・決済手数料の固定額などは別途考慮してください。</p></section>
<p>計算はブラウザ内で実行され、入力内容は当サイトのサーバーに送信しません。計算結果は参考値です。</p><script>"use strict";const $=id=>document.getElementById(id);const num=id=>Number($(id).value);const fmt=x=>Number.isFinite(x)?x.toLocaleString("ja-JP",{maximumFractionDigits:4}):"算出不可";$("calc-profit").onclick=()=>{const a=["price","units","fee","variable","fixed"].map(num);if(a.some(x=>!Number.isFinite(x)||x<0)||a[2]>100||!Number.isInteger(a[1])){$("profit-result").textContent="入力値を確認してください。販売数は0以上の整数、手数料率は0～100%です。";return}const [p,n,f,v,c]=a,rev=p*n,charge=rev*f/100,margin=p*(1-f/100)-v,profit=rev-charge-v*n-c,breakEven=margin>0?Math.ceil(c/margin):null;$("profit-result").textContent="売上："+fmt(rev)+"円\n手数料："+fmt(charge)+"円\n変動費合計："+fmt(v*n)+"円\n利益："+fmt(profit)+"円\n1件あたり限界利益："+fmt(margin)+"円\n損益分岐販売数："+(breakEven===null?"達成不可（限界利益が0以下）":fmt(breakEven)+"件")};
$("calc-profit").click();</script></main><footer>OGBデータ研究所 ／ <a href="/privacy/">プライバシーポリシー</a></footer></body></html>
